<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FINPATHIA</title>
    <meta name="build" content="1775266701" />
    <meta name="description" content="Plataforma fintech premium para controlar inversiones, gastos, deudas y patrimonio. 5 coaches IA. Pensión BTC." />
    <meta name="theme-color" content="#09090b" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%2309090b'/%3E%3Ctext x='50' y='62' text-anchor='middle' font-size='40' font-weight='800' fill='%2322c55e'%3EF%3C/text%3E%3C/svg%3E" />
  <style>
      @media print {
        @page { size: letter portrait; margin: 10mm; }
        * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; box-sizing: border-box !important; }
        body { background: #fff !important; color: #1a1a1a !important; margin: 0 !important; font-size: 10px !important; line-height: 1.35 !important; font-family: -apple-system, system-ui, sans-serif !important; }
        
        /* HIDE: sidebar, header, buttons, sliders, tooltips */
        aside, header, nav, footer, button, select,
        input[type="range"], input[type="number"], input[type="text"], input[type="date"], input[type="file"],
        span[style*="minWidth: 32"], span[style*="minWidth:32"],
        [data-no-print],
        div[style*="rgba(34,211,238"],
        div[style*="simular cuánto"],
        div[style*="cursor: pointer"],
        div[style*="position: sticky"],
        div[style*="position: fixed"] { display: none !important; }

        /* SHOW: keep cards with data visible */
        div[style*="cursor: pointer"][style*="borderLeft"] { display: flex !important; }

        /* Full width - remove sidebar gap */
        #root, #root > div, main, #root > div > div, #root > div > main,
        #root > div > div > div { 
          display: block !important; width: 100% !important; max-width: 100% !important; 
          padding: 0 !important; margin: 0 !important; flex: none !important; 
        }
        main > div { padding: 0 !important; max-width: 100% !important; }
        
        /* Remove scroll containers */
        [style*="overflow"] { overflow: visible !important; max-height: none !important; height: auto !important; }
        [style*="70vh"], [style*="85vh"], [style*="88vh"], [style*="100vh"] { max-height: none !important; height: auto !important; }
        
        /* Make 2-column simulator layout into 1 column */
        div[style*="1fr 2fr"], div[style*="2fr 1fr"], div[style*="1fr 1.2fr"],
        div[style*="minmax(340"], div[style*="minmax(320"] {
          display: block !important; grid-template-columns: 1fr !important;
        }
        
        /* Cards: compact */
        div[style*="border-radius"], div[style*="borderRadius"] { 
          background: #fff !important; border: 1px solid #ddd !important; 
          box-shadow: none !important; margin-bottom: 4px !important; 
          padding: 6px 10px !important; border-radius: 6px !important;
          page-break-inside: avoid !important; break-inside: avoid !important;
        }
        
        /* Text sizes */
        h1 { font-size: 16px !important; margin: 0 0 4px !important; color: #111 !important; }
        h2 { font-size: 14px !important; margin: 0 0 4px !important; color: #111 !important; }
        h3 { font-size: 12px !important; margin: 2px 0 !important; color: #111 !important; }
        h4, h5 { font-size: 11px !important; margin: 2px 0 !important; }
        p { margin: 2px 0 !important; font-size: 10px !important; }
        span, div, td, th, label { color: #333 !important; }
        
        /* Preserve semantic colors */
        [style*="color:#22c55e"], [style*="color: rgb(34, 197, 94)"],
        [style*="color:"#22c55e"] { color: #16a34a !important; }
        [style*="color:#ef4444"], [style*="color: rgb(239, 68, 68)"],
        [style*="color:"#ef4444"] { color: #dc2626 !important; }
        [style*="color:#3b82f6"] { color: #2563eb !important; }
        [style*="color:#f97316"], [style*="color:#f59e0b"] { color: #d97706 !important; }
        [style*="color:#a78bfa"] { color: #7c3aed !important; }
        [style*="color:#eab308"] { color: #a16207 !important; }
        [style*="color:#22d3ee"] { color: #0891b2 !important; }
        
        /* Big numbers: shrink significantly */
        div[style*="fontSize: 48"], div[style*="fontSize:48"],
        div[style*="fontSize: 64"], div[style*="fontSize:64"],
        div[style*="fontSize: 72"], div[style*="fontSize:72"] { font-size: 18px !important; }
        div[style*="fontSize: 36"], div[style*="fontSize:36"],
        div[style*="fontSize: 32"], div[style*="fontSize:32"] { font-size: 16px !important; }
        div[style*="fontSize: 28"], div[style*="fontSize:28"],
        div[style*="fontSize: 26"], div[style*="fontSize:26"] { font-size: 14px !important; }
        div[style*="fontSize: 22"], div[style*="fontSize:22"],
        div[style*="fontSize: 20"], div[style*="fontSize:20"] { font-size: 13px !important; }
        div[style*="fontSize: 18"], div[style*="fontSize:18"] { font-size: 12px !important; }
        div[style*="fontSize: 16"], div[style*="fontSize:16"],
        div[style*="fontSize: 15"], div[style*="fontSize:15"] { font-size: 11px !important; }
        
        /* Grids: force compact multi-column */
        div[style*="repeat(auto-fit"] { display: grid !important; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)) !important; gap: 4px !important; }
        div[style*="repeat(4"] { display: grid !important; grid-template-columns: repeat(4, 1fr) !important; gap: 4px !important; }
        div[style*="1fr 1fr"][style*="gap: 16"] {
          display: block !important;
        }
        div[style*="1fr 1fr"][style*="gap: 14"],
        div[style*="1fr 1fr"][style*="gap: 12"],
        div[style*="1fr 1fr"][style*="gap: 10"] {
          display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 4px !important;
        }
        
        /* Freedom bar: compact */
        div[style*="borderRadius: 20"] { padding: 6px 10px !important; margin-bottom: 4px !important; }
        div[style*="height: 36"], div[style*="height: 32"] { height: 14px !important; }
        div[style*="height: 10"], div[style*="height: 8"], div[style*="height: 6"] { height: 6px !important; }
        
        /* Income/expense cards in simulator: ultra compact */
        div[style*="borderLeft: "3px"], div[style*="borderLeft:"3px"],
        div[style*="border-left: 3px"], div[style*="borderLeft: 3px"] {
          padding: 4px 8px !important; margin-bottom: 2px !important;
          border-left-width: 2px !important; border-radius: 4px !important;
        }
        
        /* Hide slider labels like "100%" and tips */
        div[style*="opacity: 0.7"], div[style*="opacity: 0.6"],
        div[style*="opacity: 0.5"] { display: none !important; }
        
        /* Hide slider wrappers with accentColor (the entire slider row) */
        div[style*="accentColor"] { display: none !important; }
        
        /* Simulator income/expense items: only show name + value */
        div[style*="borderLeft: "3px"] > div:last-child,
        div[style*="borderLeft:"3px"] > div:last-child { display: none !important; }
        
        /* Hide "edita este ingreso" tips */
        div[style*="background:"#22d3ee"], div[style*="background: "#22d3ee"],
        div[style*="background:rgba(34,211,238"],
        div[style*="Edita este"], div[style*="click para info"],
        div[style*="Mueve para simular"], div[style*="Capital invertido:"] { display: none !important; }
        
        /* Charts: reasonable size */
        .recharts-wrapper { max-height: 120px !important; page-break-inside: avoid !important; }
        .recharts-responsive-container { height: 120px !important; max-height: 120px !important; }
        svg.recharts-surface { max-height: 120px !important; }
        svg text { fill: #555 !important; font-size: 8px !important; }
        
        /* Tables ultra compact */
        table { font-size: 9px !important; width: 100% !important; border-collapse: collapse !important; }
        th { background: #f0f0f0 !important; padding: 3px 5px !important; font-size: 8px !important; color: #333 !important; }
        td { padding: 3px 5px !important; color: #333 !important; }
        
        /* Padding/margin aggressive reduction */
        div[style*="padding: 32"], div[style*="padding:32"] { padding: 8px !important; }
        div[style*="padding: 28"], div[style*="padding:28"] { padding: 6px 10px !important; }
        div[style*="padding: 24"], div[style*="padding:24"] { padding: 5px 10px !important; }
        div[style*="padding: 20"], div[style*="padding:20"] { padding: 4px 8px !important; }
        div[style*="padding: 16"], div[style*="padding:16"] { padding: 3px 8px !important; }
        div[style*="padding: 14"], div[style*="padding:14"] { padding: 3px 6px !important; }
        div[style*="padding: 12"], div[style*="padding:12"] { padding: 3px 6px !important; }
        div[style*="marginBottom: 28"], div[style*="marginBottom:28"] { margin-bottom: 4px !important; }
        div[style*="marginBottom: 24"], div[style*="marginBottom:24"] { margin-bottom: 4px !important; }
        div[style*="marginBottom: 20"], div[style*="marginBottom:20"] { margin-bottom: 3px !important; }
        div[style*="marginBottom: 16"], div[style*="marginBottom:16"] { margin-bottom: 3px !important; }
        div[style*="marginBottom: 14"], div[style*="marginBottom:14"] { margin-bottom: 2px !important; }
        div[style*="marginBottom: 12"], div[style*="marginBottom:12"] { margin-bottom: 2px !important; }
        div[style*="marginTop: 20"], div[style*="marginTop:20"] { margin-top: 4px !important; }
        div[style*="marginTop: 16"], div[style*="marginTop:16"] { margin-top: 3px !important; }
        div[style*="marginTop: 14"], div[style*="marginTop:14"] { margin-top: 2px !important; }
        div[style*="marginTop: 12"], div[style*="marginTop:12"] { margin-top: 2px !important; }
        div[style*="gap: 20"], div[style*="gap:20"] { gap: 4px !important; }
        div[style*="gap: 16"], div[style*="gap:16"] { gap: 3px !important; }
        div[style*="gap: 14"], div[style*="gap:14"] { gap: 3px !important; }
        div[style*="gap: 12"], div[style*="gap:12"] { gap: 2px !important; }
        div[style*="gap: 10"], div[style*="gap:10"] { gap: 2px !important; }
        div[style*="gap: 8"], div[style*="gap:8"] { gap: 2px !important; }
        
        /* DISPONIBLE hero: compact */
        div[style*="clamp(1.8rem"], div[style*="clamp("] { font-size: 16px !important; line-height: 1.2 !important; }
        
        /* Sticky elements: unstick */
        div[style*="position: sticky"], div[style*="position:sticky"] { position: static !important; }
        
        /* Report branding */
        body::before { content: "FINPATHIA — Reporte Financiero"; display: block; font-size: 13px; font-weight: 800; color: #16a34a; padding: 0 0 6px; border-bottom: 2px solid #16a34a; margin-bottom: 8px; }
        body::after { content: "Generado el " attr(data-date) " | finpathia.netlify.app"; display: block; font-size: 8px; color: #999; padding: 6px 0 0; border-top: 1px solid #ddd; margin-top: 6px; text-align: center; }
      }
    </style>
    </head>
  <body style="margin:0;background:#09090b;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

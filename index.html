<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinPath V6 — Planificador Financiero</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7b500">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0b1426;--bg2:#0f1b32;--bg3:#142240;--bg4:#1a2d52;
  --accent:#00d4aa;--accent2:#00c8ff;--accent-grad:linear-gradient(135deg,#00e5a0,#00c8ff);
  --green:#00e5a0;--red:#ff5c7c;--blue:#00c8ff;--orange:#ffaa40;--purple:#a78bfa;--gold:#f0c040;
  --txt:#e8edf5;--txt2:#8899b4;--txt3:#556b8a;
  --border:rgba(0,212,170,0.08);--glow:rgba(0,212,170,0.12);
}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;}

/* ── TOP BAR ── */
.top-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0.65rem 2rem;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);}
.brand{display:flex;align-items:center;gap:0.8rem;}
.brand-icon{width:38px;height:38px;background:var(--accent-grad);-webkit-mask:url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z'/%3E%3C/svg%3E") center/contain no-repeat;mask:url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z'/%3E%3C/svg%3E") center/contain no-repeat;}
.brand-text .bn{font-size:1.35rem;font-weight:700;letter-spacing:-0.02em;}
.brand-text .bn span:first-child{color:#fff;}
.brand-text .bn span:last-child{color:var(--accent2);}
.brand-text .bs{font-size:0.62rem;color:var(--txt3);text-transform:uppercase;letter-spacing:2.5px;margin-top:-0.05rem;}
.top-right{display:flex;align-items:center;gap:1rem;}
.trm-box{font-size:0.75rem;color:var(--txt3);}
.trm-box b{color:var(--accent);font-weight:600;}
.trm-input{background:var(--bg3);border:1px solid var(--border);color:var(--txt);padding:0.2rem 0.35rem;border-radius:4px;width:62px;font-size:0.75rem;text-align:center;font-family:inherit;outline:none;}
.trm-input:focus{border-color:var(--accent);}
.curr-btn{background:var(--accent-grad);color:#0b1426;border:none;padding:0.35rem 0.8rem;border-radius:6px;cursor:pointer;font-weight:700;font-size:0.75rem;font-family:inherit;letter-spacing:0.02em;}

/* ── NAV ── */
.nav{background:var(--bg2);padding:0 1.5rem;border-bottom:1px solid var(--border);display:flex;gap:0;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.nav-btn{background:transparent;border:none;color:var(--txt3);padding:0.7rem 0.9rem;cursor:pointer;font-size:0.78rem;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap;transition:all 0.2s;font-family:inherit;letter-spacing:0.01em;}
.nav-btn:hover{color:var(--txt2);}
.nav-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
.nav-upload{margin-left:auto;background:rgba(0,212,170,0.08);border-radius:6px;color:var(--accent)!important;}

/* ── LAYOUT ── */
.container{max-width:1400px;margin:0 auto;padding:1.2rem 1.8rem;}
.view{display:none;animation:fadeIn 0.2s ease;}.view.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

/* ── CARDS ── */
.card{background:var(--bg2);border-radius:12px;border:1px solid var(--border);margin-bottom:1rem;overflow:hidden;transition:border-color 0.2s;}
.card:hover{border-color:rgba(0,212,170,0.15);}
.card-header{padding:0.8rem 1.2rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(0,212,170,0.03),transparent);}
.card-header h3{font-size:0.88rem;color:var(--accent);font-weight:600;letter-spacing:-0.01em;}
.card-body{padding:1.2rem;}

/* ── METRICS ── */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0.8rem;margin-bottom:1rem;}
.mcard{background:linear-gradient(135deg,var(--bg2),var(--bg3));border-radius:10px;padding:0.9rem 1rem;border:1px solid var(--border);position:relative;overflow:hidden;}
.mcard::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent-grad);opacity:0.6;}
.mcard .ml{font-size:0.62rem;color:var(--txt3);text-transform:uppercase;letter-spacing:0.8px;font-weight:500;}
.mcard .mv{font-size:1.35rem;font-weight:700;margin-top:0.15rem;}
.mcard .ms{font-size:0.68rem;color:var(--txt3);margin-top:0.1rem;}

/* ── FORMS ── */
.form-row{display:flex;align-items:center;gap:0.7rem;margin-bottom:0.6rem;flex-wrap:wrap;}
.form-row label{font-size:0.78rem;color:var(--txt2);min-width:125px;font-weight:500;}
.form-input{background:var(--bg3);border:1px solid var(--border);color:var(--txt);padding:0.4rem 0.65rem;border-radius:6px;font-size:0.82rem;font-family:inherit;outline:none;transition:all 0.2s;}
.form-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--glow);}
.form-select{background:var(--bg3);border:1px solid var(--border);color:var(--txt);padding:0.4rem 0.65rem;border-radius:6px;font-size:0.82rem;font-family:inherit;outline:none;cursor:pointer;}

/* ── BUTTONS ── */
.btn{padding:0.45rem 0.9rem;border:none;border-radius:6px;cursor:pointer;font-weight:600;font-size:0.78rem;font-family:inherit;transition:all 0.2s;letter-spacing:0.01em;}
.btn-accent{background:var(--accent-grad);color:#0b1426;}.btn-accent:hover{opacity:0.88;transform:translateY(-1px);}
.btn-green{background:rgba(0,229,160,0.12);color:var(--green);border:1px solid rgba(0,229,160,0.25);}.btn-green:hover{background:rgba(0,229,160,0.2);}
.btn-red{background:rgba(255,92,124,0.1);color:var(--red);border:1px solid rgba(255,92,124,0.2);}.btn-red:hover{background:rgba(255,92,124,0.18);}
.btn-ghost{background:var(--bg3);color:var(--txt2);border:1px solid var(--border);}.btn-ghost:hover{color:var(--accent);border-color:var(--accent);}
.btn-sm{padding:0.25rem 0.6rem;font-size:0.72rem;}

/* ── EMPTY STATE ── */
.empty-state{text-align:center;padding:2.5rem 2rem;color:var(--txt3);}
.empty-state .icon{font-size:2.5rem;margin-bottom:0.6rem;opacity:0.4;}
.empty-state .title{font-size:1rem;font-weight:600;color:var(--txt2);margin-bottom:0.3rem;}
.empty-state .desc{font-size:0.82rem;margin-bottom:1rem;line-height:1.6;}

/* ── TABLES ── */
table{width:100%;border-collapse:collapse;}
thead th{text-align:left;padding:0.55rem 0.7rem;font-size:0.66rem;color:var(--txt3);text-transform:uppercase;border-bottom:1px solid var(--border);letter-spacing:0.6px;font-weight:600;}
tbody td{padding:0.6rem 0.7rem;border-bottom:1px solid rgba(0,212,170,0.04);font-size:0.82rem;}
tbody tr:hover{background:rgba(0,212,170,0.03);}

/* ── SLIDER ── */
input[type=range]{width:100%;accent-color:var(--accent);margin:0.25rem 0;height:4px;}

/* ── TABS ── */
.tab-bar{display:flex;gap:0.3rem;margin-bottom:1rem;flex-wrap:wrap;}
.tab-btn{background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--txt3);padding:0.45rem 0.9rem;cursor:pointer;font-size:0.78rem;font-weight:600;font-family:inherit;transition:all 0.2s;}
.tab-btn:hover{border-color:var(--accent);color:var(--accent);}
.tab-btn.active{background:var(--accent-grad);border-color:transparent;color:#0b1426;}

/* ── PENSION RESULTS ── */
.pen-result{background:var(--bg3);border-radius:12px;padding:1.3rem;border:1px solid var(--border);}
.pen-result.highlight{border-color:var(--accent);background:rgba(0,212,170,0.04);box-shadow:0 0 20px rgba(0,212,170,0.06);}
.pen-result .pen-label{font-size:0.65rem;color:var(--txt3);text-transform:uppercase;letter-spacing:1px;}
.pen-result .pen-value{font-size:1.8rem;font-weight:700;margin:0.2rem 0;}
.pen-result .pen-sub{font-size:0.78rem;color:var(--txt3);}

/* ── PROGRESS BAR ── */
.pbar{background:var(--bg3);border-radius:8px;height:24px;overflow:hidden;margin:0.35rem 0;}
.pbar-fill{height:100%;border-radius:8px;display:flex;align-items:center;padding-left:10px;font-weight:700;font-size:0.72rem;color:#0b1426;transition:width 0.5s;}

/* ── UPLOAD ZONE ── */
.drop-zone{border:2px dashed rgba(0,212,170,0.2);border-radius:12px;padding:2.5rem 2rem;text-align:center;cursor:pointer;transition:all 0.3s;background:rgba(0,212,170,0.02);}
.drop-zone:hover,.drop-zone.active{border-color:var(--accent);background:rgba(0,212,170,0.05);box-shadow:0 0 30px rgba(0,212,170,0.08);}

/* ── SECTION UPLOAD MINI ── */
.section-upload{display:inline-flex;align-items:center;gap:0.4rem;padding:0.3rem 0.7rem;background:rgba(0,200,255,0.08);border:1px solid rgba(0,200,255,0.15);border-radius:6px;cursor:pointer;font-size:0.72rem;color:var(--blue);font-weight:600;transition:all 0.2s;}
.section-upload:hover{background:rgba(0,200,255,0.15);border-color:var(--blue);}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .top-bar{flex-direction:column;gap:0.4rem;align-items:flex-start;padding:0.6rem 1rem;}
  .container{padding:0.8rem 1rem;}
  .mgrid{grid-template-columns:1fr 1fr;}
  table{font-size:0.75rem;}
  thead th,tbody td{padding:0.4rem 0.5rem;}
}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px;}::-webkit-scrollbar-thumb:hover{background:var(--accent);}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
  <div class="brand">
    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2300e5a0'/%3E%3Cstop offset='100%25' stop-color='%2300c8ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M8 28 C4 24 2 18 6 12 C10 6 18 4 24 6 L14 16 L26 10 C30 14 30 22 26 28 C22 34 14 34 8 28Z' fill='url(%23g)'/%3E%3Cpath d='M14 16 L24 6 C20 4 16 4 12 8 L14 16Z' fill='url(%23g)' opacity='0.6'/%3E%3C/svg%3E" alt="" style="height:32px;width:32px;">
    <div class="brand-text">
      <div class="bn"><span>Fin</span><span>path</span></div>
      <div class="bs">Bienestar Financiero</div>
    </div>
  </div>
  <div class="top-right">
    <div class="trm-box">TRM <b>$<input class="trm-input" id="trm-input" value="4200" onchange="updateTRM()"></b> COP/USD</div>
    <button class="curr-btn" onclick="toggleCurrency()">USD ⇄ COP</button>
  </div>
</div>

<!-- NAV -->
<nav class="nav">
  <button class="nav-btn active" onclick="go('dashboard')">📊 Dashboard</button>
  <button class="nav-btn" onclick="go('inversiones')">🏠 Inversiones</button>
  <button class="nav-btn" onclick="go('ingresos')">💰 Ingresos</button>
  <button class="nav-btn" onclick="go('gastos')">📉 Gastos</button>
  <button class="nav-btn" onclick="go('deudas')">💳 Deudas</button>
  <button class="nav-btn" onclick="go('simulador')">🔮 Simulador</button>
  <button class="nav-btn" onclick="go('coach')">🧠 Maestros</button>
  <button class="nav-btn" onclick="go('pensiones')">👴 Pensiones</button>
  <button class="nav-btn" onclick="go('btc')">₿ Ahorro BTC</button>
  <button class="nav-btn nav-upload" onclick="go('cargar')">📂 Cargar Datos</button>
</nav>

<!-- VIEWS -->
<div class="container">

<!-- DASHBOARD -->
<div id="view-dashboard" class="view active"><div id="dash-content"></div></div>

<!-- INVERSIONES -->
<div id="view-inversiones" class="view"><div id="inv-content"></div></div>

<!-- INGRESOS -->
<div id="view-ingresos" class="view"><div id="ing-content"></div></div>

<!-- GASTOS -->
<div id="view-gastos" class="view"><div id="gas-content"></div></div>

<!-- DEUDAS -->
<div id="view-deudas" class="view"><div id="deu-content"></div></div>

<!-- SIMULADOR DE BIENESTAR FINANCIERO -->
<div id="view-simulador" class="view">
  <div class="card" style="margin-bottom:1rem;border-top:3px solid var(--gold);"><div class="card-header"><h3>📊 Estado de Bienestar Financiero</h3><button class="btn btn-red btn-sm" onclick="resetSim()">↺ Reset</button></div><div class="card-body" id="sim-results"></div></div>
  <div class="card"><div class="card-header"><h3>🔧 Ajusta cada Ingreso y Gasto</h3></div><div class="card-body" id="sim-params" style="max-height:70vh;overflow-y:auto;"></div></div>
</div>

<!-- COACH IA -->
<div id="view-coach" class="view"><div id="coach-content"></div></div>

<!-- PENSIONES -->
<div id="view-pensiones" class="view"><div id="pen-content"></div></div>

<!-- BTC SAVINGS -->
<div id="view-btc" class="view"><div id="btc-content"></div></div>

<!-- CARGAR DATOS -->
<div id="view-cargar" class="view"><div id="cargar-content"></div></div>

</div><!-- /container -->

<script>
// ════════════════════════════════════════════════════════════
// FINPATH V6 — CORE STATE
// ════════════════════════════════════════════════════════════
var TRM = 4200;
var CURR = 'USD';
var SMMLV_2025 = 1423500; // Salario mínimo 2025 Colombia

// All user data lives here — starts empty
var DATA = {
  inversiones: [],   // {id, nombre, tipo, ubicacion, valorCompra, valorActual, deuda, notas}
  ingresos: [],      // {id, nombre, monto, tipo, notas}
  gastos: [],        // {id, nombre, categoria, monto, tipo, notas}
  deudas: [],        // {id, nombre, monto, pago, tasa, notas}
  pension: {         // Single person pension calculator
    nombre: '',
    edad: 0,
    sexo: '',        // 'M' or 'F'
    semanas: 0,
    ibc_sm: 0,       // IBC in # of SMMLV
    saldoPrivado: 0, // COP
    rendPrivado: 8   // % anual
  },
  btc: {
    holdingsUSD: 0,
    aporteMensualUSD: 0,
    cagr: 40,
    anios: 10
  }
};

// ════════════════════════════════════════════════════════════
// PERSISTENCE
// ════════════════════════════════════════════════════════════
function save(){ try{ localStorage.setItem('finpath_v6', JSON.stringify(DATA)); }catch(e){} }
function load(){
  try{
    var d = localStorage.getItem('finpath_v6');
    if(d){ var parsed = JSON.parse(d); Object.assign(DATA, parsed); }
  }catch(e){}
}
function resetAll(){
  if(!confirm('¿Borrar TODOS los datos? Esta acción no se puede deshacer.')) return;
  localStorage.removeItem('finpath_v6');
  location.reload();
}

// ════════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════════
function fUSD(v){ return '$' + Math.round(v).toLocaleString('en-US'); }
function fCOP(v){
  if(Math.abs(v) >= 1e9) return '$' + (v/1e9).toFixed(2) + 'B';
  if(Math.abs(v) >= 1e6) return '$' + (v/1e6).toFixed(1) + 'M';
  return '$' + Math.round(v).toLocaleString('es-CO');
}
function fmt(v){
  if(CURR === 'USD') return fUSD(v);
  return fCOP(v * TRM);
}
function fmt2(v){
  if(CURR === 'USD') return fCOP(v * TRM);
  return fUSD(v);
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).substr(2,4); }
function clr(v){ return v >= 0 ? 'var(--green)' : 'var(--red)'; }

// ════════════════════════════════════════════════════════════
// NAVIGATION
// ════════════════════════════════════════════════════════════
function go(view){
  document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active');});
  document.getElementById('view-'+view).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active');});
  if(event && event.target) event.target.classList.add('active');
  renderView(view);
}
function renderView(v){
  if(v==='dashboard') renderDashboard();
  if(v==='inversiones') renderInversiones();
  if(v==='ingresos') renderIngresos();
  if(v==='gastos') renderGastos();
  if(v==='deudas') renderDeudas();
  if(v==='simulador') renderSimulador();
  if(v==='coach') renderCoach();
  if(v==='pensiones') renderPensiones();
  if(v==='btc') renderBTC();
  if(v==='cargar') renderCargar();
}
function toggleCurrency(){
  CURR = CURR==='USD'?'COP':'USD';
  document.querySelector('.curr-btn').textContent = CURR==='USD'?'USD ⇄ COP':'COP ⇄ USD';
  renderActive();
}
function updateTRM(){
  var v = parseFloat(document.getElementById('trm-input').value);
  if(!isNaN(v) && v > 0) TRM = v;
  renderActive();
}
function renderActive(){
  var el = document.querySelector('.view.active');
  if(el) renderView(el.id.replace('view-',''));
}

// ════════════════════════════════════════════════════════════
// DASHBOARD
// ════════════════════════════════════════════════════════════
function renderDashboard(){
  var totalActivos = DATA.inversiones.reduce(function(s,i){return s+i.valorActual;},0);
  var totalDeuda = DATA.deudas.reduce(function(s,d){return s+d.monto;},0);
  var netWorth = totalActivos - totalDeuda;
  var totalIng = DATA.ingresos.reduce(function(s,i){return s+i.monto;},0);
  var totalGas = DATA.gastos.reduce(function(s,g){return s+g.monto;},0);
  var totalCuotas = DATA.deudas.reduce(function(s,d){return s+d.pago;},0);
  var cashFlow = totalIng - totalGas - totalCuotas;

  var h = '';

  // Métricas
  h += '<div class="mgrid">';
  h += mcard('Patrimonio Neto', fmt(netWorth), fmt2(netWorth), netWorth >= 0 ? 'var(--green)' : 'var(--red)');
  h += mcard('Activos Totales', fmt(totalActivos), DATA.inversiones.length + ' inversiones', 'var(--accent)');
  h += mcard('Deuda Total', fmt(totalDeuda), DATA.deudas.length + ' obligaciones', 'var(--red)');
  h += mcard('Ingresos / mes', fmt(totalIng), DATA.ingresos.length + ' fuentes', 'var(--green)');
  h += mcard('Gastos / mes', fmt(totalGas), DATA.gastos.length + ' items', 'var(--orange)');
  h += mcard('Cash Flow / mes', fmt(cashFlow), cashFlow >= 0 ? '✅ Positivo' : '⚠️ Negativo', clr(cashFlow));
  h += '</div>';

  if(DATA.inversiones.length === 0 && DATA.ingresos.length === 0){
    h += '<div class="empty-state"><div class="icon">🚀</div><div class="title">¡Bienvenido a FinPath!</div>';
    h += '<div class="desc">Empieza agregando tus inversiones, ingresos, gastos y deudas.<br>Luego usa los módulos de Pensiones y Ahorro BTC para planificar tu futuro.</div>';
    h += '<button class="btn btn-accent" onclick="go(\'inversiones\')">Agregar mi primera inversión</button></div>';
  } else {
    // Resumen por tipo de inversión
    if(DATA.inversiones.length > 0){
      h += '<div class="card"><div class="card-header"><h3>📊 Composición del Portafolio</h3></div><div class="card-body">';
      var tipos = {};
      DATA.inversiones.forEach(function(inv){ tipos[inv.tipo] = (tipos[inv.tipo]||0) + inv.valorActual; });
      var maxTipo = Math.max.apply(null, Object.values(tipos).concat([1]));
      Object.keys(tipos).sort(function(a,b){return tipos[b]-tipos[a];}).forEach(function(t){
        var pct = totalActivos > 0 ? (tipos[t]/totalActivos*100) : 0;
        h += '<div style="margin-bottom:0.6rem;"><div style="display:flex;justify-content:space-between;font-size:0.82rem;margin-bottom:0.2rem;"><span style="color:var(--txt2);">'+t+'</span><span style="color:var(--accent);font-weight:600;">'+fmt(tipos[t])+' ('+pct.toFixed(1)+'%)</span></div>';
        h += '<div class="pbar"><div class="pbar-fill" style="width:'+pct+'%;background:var(--gold);"></div></div></div>';
      });
      h += '</div></div>';
    }
  }

  document.getElementById('dash-content').innerHTML = h;
}

function mcard(label, val, sub, color){
  return '<div class="mcard" style="border-top-color:'+color+';"><div class="ml">'+label+'</div><div class="mv" style="color:'+color+';">'+val+'</div><div class="ms">'+sub+'</div></div>';
}

// ════════════════════════════════════════════════════════════

// ════════════════════════════════════════════════════════════
// MÓDULO PENSIONES — Calculadora Colombia (1 persona)
// ════════════════════════════════════════════════════════════
// Reglas:
// - Mujer jubila a 57, Hombre a 62
// - Colpensiones: mínimo 1,300 semanas, tasa reemplazo según IBC
// - Fondo Privado: saldo acumulado → anualidad (saldo/240 meses)
// ════════════════════════════════════════════════════════════

function calcPensionPrivado(p){
  var SM = SMMLV_2025;
  var IBC = p.ibc_sm * SM;
  var aporteMes = IBC * 0.16;
  var edadJub = p.sexo === 'F' ? 57 : 62;
  var aniosRest = Math.max(0, edadJub - p.edad);
  var rendMes = Math.pow(1 + p.rendPrivado/100, 1/12) - 1;
  var saldo = p.saldoPrivado;

  // Proyectar saldo con aportes futuros
  for(var m = 0; m < aniosRest * 12; m++){
    saldo = saldo * (1 + rendMes) + aporteMes;
  }

  var mesada = saldo / 240; // anualidad 20 años

  return {
    tipo: 'Fondo Privado',
    saldoFinal: saldo,
    mesada: mesada,
    mesadaUSD: mesada / TRM,
    edadJub: edadJub,
    aniosRest: aniosRest,
    aporteMes: aporteMes
  };
}

function calcPensionColpensiones(p){
  var SM = SMMLV_2025;
  var IBC = p.ibc_sm * SM;
  var edadJub = p.sexo === 'F' ? 57 : 62;
  var aniosRest = Math.max(0, edadJub - p.edad);
  var semanasAlJub = p.semanas + (aniosRest * 52);

  // IBL = promedio IBC últimos 10 años (simplificado)
  var IBL = IBC;

  // Tasa de reemplazo
  var s = IBL / SM; // número de salarios mínimos
  var rBase = 65.50 - 0.50 * s;
  if(rBase < 33.99) rBase = 33.99;

  // Bonus por semanas extras sobre 1,300
  var semanasExtra = Math.max(0, semanasAlJub - 1300);
  var bonus = Math.floor(semanasExtra / 50) * 1.5;
  var rTotal = Math.min(rBase + bonus, 80);

  var pensionBruta = IBL * (rTotal / 100);
  var pensionMax = 25 * SM;
  if(pensionBruta > pensionMax) pensionBruta = pensionMax;
  var pensionNeta = pensionBruta * 0.88; // descuentos salud

  var cumpleRequisitos = semanasAlJub >= 1300;
  var semanasRestantes = Math.max(0, 1300 - p.semanas);

  return {
    tipo: 'Colpensiones',
    mesada: pensionNeta,
    mesadaUSD: pensionNeta / TRM,
    pensionBruta: pensionBruta,
    IBL: IBL,
    rBase: rBase,
    bonus: bonus,
    rTotal: rTotal,
    edadJub: edadJub,
    aniosRest: aniosRest,
    semanasAlJub: semanasAlJub,
    cumpleRequisitos: cumpleRequisitos,
    semanasRestantes: semanasRestantes
  };
}

function renderPensiones(){
  var p = DATA.pension;
  var h = '';

  h += '<div style="margin-bottom:1.5rem;"><h1 style="font-size:1.8rem;background:var(--accent-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:0.3rem;">👴 Calculadora de Pensión</h1>';
  h += '<p style="color:var(--txt3);font-size:0.88rem;">Sistema pensional colombiano — Fondo Privado vs Colpensiones</p></div>';

  // ── FORMULARIO ──
  h += '<div class="card"><div class="card-header"><h3>⚙️ Datos del Cotizante</h3></div><div class="card-body">';
  h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">';

  h += '<div class="form-row"><label>Semanas cotizadas</label><input class="form-input" type="number" style="width:100px;" id="pen-semanas" value="'+(p.semanas||'')+'" min="0" max="3000" onchange="penUpdate()"></div>';
  h += '<div class="form-row"><label>IBC (# SMMLV)</label><input class="form-input" type="number" step="0.1" style="width:80px;" id="pen-ibc" value="'+(p.ibc_sm||'')+'" min="1" max="25" onchange="penUpdate()"></div>';
  h += '<div class="form-row"><label>Saldo fondo privado (COP)</label><input class="form-input" type="number" style="width:160px;" id="pen-saldo" value="'+(p.saldoPrivado||'')+'" onchange="penUpdate()"></div>';

  // ── RESULTADOS ──
  if(p.edad > 0 && p.sexo && p.ibc_sm > 0){
    var priv = calcPensionPrivado(p);

    var mejor = colp.mesada > priv.mesada ? 'colp' : 'priv';

    h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;margin-top:0.5rem;">';

    // Fondo Privado
    h += '<div class="pen-result'+(mejor==='priv'?' highlight':'')+'">';
    h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;"><div class="pen-label">🏦 Fondo Privado</div>'+(mejor==='priv'?'<span style="background:var(--green);color:#fff;padding:0.15rem 0.6rem;border-radius:10px;font-size:0.7rem;font-weight:700;">★ MEJOR</span>':'')+'</div>';
    h += '<div class="pen-value" style="color:var(--green);">'+fCOP(priv.mesada)+'</div>';
    h += '<div class="pen-sub">'+fUSD(priv.mesadaUSD)+' USD / mes</div>';
    h += '<div style="margin-top:1rem;font-size:0.8rem;color:var(--txt2);line-height:1.6;">';

    h += 'Rendimiento: '+p.rendPrivado+'% anual<br>';
    h += 'Jubilación a los <strong>'+priv.edadJub+' años</strong> (faltan '+priv.aniosRest+' años)<br>';

    // Colpensiones
    h += '<div class="pen-result'+(mejor==='colp'?' highlight':'')+'">';
    h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;"><div class="pen-label">🏛️ Colpensiones</div>'+(mejor==='colp'?'<span style="background:var(--green);color:#fff;padding:0.15rem 0.6rem;border-radius:10px;font-size:0.7rem;font-weight:700;">★ MEJOR</span>':'')+'</div>';

    h += '<div class="pen-sub">'+fUSD(colp.mesadaUSD)+' USD / mes</div>';
    h += '<div style="margin-top:1rem;font-size:0.8rem;color:var(--txt2);line-height:1.6;">';
    h += 'IBL: '+fCOP(colp.IBL)+'<br>';
    h += 'Tasa reemplazo: '+colp.rTotal.toFixed(1)+'% (base '+colp.rBase.toFixed(1)+'% + bonus '+colp.bonus.toFixed(1)+'%)<br>';
    h += 'Semanas al jubilar: '+colp.semanasAlJub;
    if(!colp.cumpleRequisitos){
      h += '<br><span style="color:var(--red);font-weight:600;">⚠️ Faltan '+colp.semanasRestantes+' semanas para cumplir el mínimo de 1,300</span>';

function calcBTCSavings(holdingsUSD, aporteMesUSD, cagrPct, anios){
  var cagrAnual = cagrPct / 100;
  var valorActual = holdingsUSD;
  var totalAportado = holdingsUSD;
  var proyeccion = [];

  for(var y = 1; y <= anios; y++){
    for(var m = 1; m <= 12; m++){
      valorActual = valorActual * Math.pow(1 + cagrAnual, 1/12) + aporteMesUSD;
      totalAportado += aporteMesUSD;
    }
    proyeccion.push({
      anio: y,
      valor: valorActual,
      aportado: totalAportado,
      ganancia: valorActual - totalAportado,
      multiplo: totalAportado > 0 ? valorActual / totalAportado : 0
    });
  }

  return proyeccion;
}

// SIMULADOR DE BIENESTAR FINANCIERO
// ════════════════════════════════════════════════════════════
// Each slider overrides the real value. simVals[key] = simulated value
// Keys: 'ing_{id}' for ingresos, 'gas_{id}' for gastos, 'deu_{id}' for deuda cuota
var simVals = {};
function simGet(key, def){ return simVals.hasOwnProperty(key) ? simVals[key] : def; }
function resetSim(){ simVals = {}; renderSimulador(); }

function renderSimulador(){
  // ── Calcular totales reales ──
  var realIng = DATA.ingresos.reduce(function(s,i){return s+i.monto;},0);
  var realGas = DATA.gastos.reduce(function(s,g){return s+g.monto;},0);
  var realCuotas = DATA.deudas.reduce(function(s,d){return s+d.pago;},0);
  var totalActivos = DATA.inversiones.reduce(function(s,i){return s+i.valorActual;},0);
  var totalDeuda = DATA.deudas.reduce(function(s,d){return s+d.monto;},0);

  // ── Calcular totales simulados ──
  var simIng = 0;
  DATA.ingresos.forEach(function(i){ simIng += simGet('ing_'+i.id, i.monto); });
  var simGas = 0;
  DATA.gastos.forEach(function(g){ simGas += simGet('gas_'+g.id, g.monto); });
  var simCuotas = 0;
  DATA.deudas.forEach(function(d){ simCuotas += simGet('deu_'+d.id, d.pago); });

  var cashFlow = simIng - simGas - simCuotas;
  var realCF = realIng - realGas - realCuotas;
  var independencia = (simGas + simCuotas) > 0 ? (simIng / (simGas + simCuotas)) * 100 : 0;
  var realInd = (realGas + realCuotas) > 0 ? (realIng / (realGas + realCuotas)) * 100 : 0;
  var netWorth = totalActivos - totalDeuda;

  // ════════ RESULTS ════════
  var rh = '';

  if(DATA.ingresos.length === 0 && DATA.gastos.length === 0){
    rh += '<div class="empty-state"><div class="icon">🔮</div><div class="title">Simulador vacío</div>';
    rh += '<div class="desc">Primero agrega tus ingresos, gastos y deudas en las secciones correspondientes.<br>El simulador genera sliders automáticos para cada item que ingreses.</div>';
    rh += '<button class="btn btn-accent" onclick="go(\'ingresos\')">Agregar Ingresos</button></div>';
    document.getElementById('sim-results').innerHTML = rh;
    document.getElementById('sim-params').innerHTML = '';
    return;
  }

  // ── Métricas principales ──
  rh += '<div class="mgrid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));">';
  rh += simMetric('Ingresos / mes', fmt(simIng), simIng > realIng ? '▲' : (simIng < realIng ? '▼' : '='), 'var(--green)');
  rh += simMetric('Gastos / mes', fmt(simGas), simGas < realGas ? '▼' : (simGas > realGas ? '▲' : '='), 'var(--orange)');
  rh += simMetric('Cuotas Deuda', fmt(simCuotas), '', 'var(--red)');
  rh += simMetric('Cash Flow / mes', fmt(cashFlow), fmt(cashFlow * 12) + '/año', clr(cashFlow));
  rh += simMetric('Independencia', independencia.toFixed(1) + '%', (independencia >= 100 ? '✅ Libre' : '⚠️ Faltan ' + (100 - independencia).toFixed(0) + '%'), independencia >= 100 ? 'var(--green)' : 'var(--orange)');
  rh += simMetric('Patrimonio Neto', fmt(netWorth), '', 'var(--accent)');
  rh += '</div>';

  // ── Barra de independencia financiera ──
  var barPct = Math.min(independencia, 150);
  var barColor = independencia >= 100 ? 'var(--green)' : (independencia >= 70 ? 'var(--orange)' : 'var(--red)');
  rh += '<div style="margin:0.5rem 0 1rem;">';
  rh += '<div style="display:flex;justify-content:space-between;margin-bottom:0.3rem;"><span style="font-size:0.82rem;color:var(--txt2);font-weight:500;">Independencia Financiera</span><span style="font-weight:700;color:'+barColor+';">'+independencia.toFixed(1)+'%</span></div>';
  rh += '<div class="pbar"><div class="pbar-fill" style="width:'+Math.min(barPct, 100)+'%;background:'+barColor+';">'+independencia.toFixed(0)+'%</div></div>';
  if(independencia >= 100){
    rh += '<div style="font-size:0.78rem;color:var(--green);margin-top:0.2rem;">✅ Tus ingresos cubren todos tus gastos y deudas. ¡Independencia financiera alcanzada!</div>';
  } else {
    var faltante = (simGas + simCuotas) - simIng;
    rh += '<div style="font-size:0.78rem;color:var(--orange);margin-top:0.2rem;">Necesitas '+fmt(faltante)+'/mes adicionales para alcanzar independencia financiera.</div>';
  }
  rh += '</div>';

  // ── Cambio vs Real ──
  var cfDelta = cashFlow - realCF;
  if(Math.abs(cfDelta) > 0.5){
    rh += '<div style="padding:0.6rem 0.8rem;background:'+(cfDelta > 0 ? 'rgba(0,200,150,0.08)' : 'rgba(231,76,111,0.08)')+';border-left:3px solid '+(cfDelta > 0 ? 'var(--green)' : 'var(--red)')+';border-radius:6px;font-size:0.82rem;color:var(--txt2);">';
    rh += (cfDelta > 0 ? '📈' : '📉') + ' Con estos ajustes tu cash flow cambia en <strong style="color:'+(cfDelta > 0 ? 'var(--green)' : 'var(--red)')+';">'+fmt(cfDelta)+'/mes</strong> ('+fmt(cfDelta*12)+'/año) vs tu situación actual.</div>';
  }

  document.getElementById('sim-results').innerHTML = rh;

  // ════════ SLIDERS ════════
  var sh = '';

  // ── INGRESOS ──
  if(DATA.ingresos.length > 0){
    sh += '<div style="margin-bottom:1.2rem;">';
    sh += '<h4 style="color:var(--green);font-size:0.85rem;margin-bottom:0.6rem;">📈 INGRESOS</h4>';
    DATA.ingresos.forEach(function(ing){
      var key = 'ing_' + ing.id;
      var base = ing.monto;
      var cur = simGet(key, base);
      var maxVal = Math.max(base * 3, 1000);
      var step = Math.max(Math.round(base * 0.01), 10);
      var changed = Math.abs(cur - base) > 0.5;
      sh += simSlider(key, ing.nombre, ing.tipo, cur, 0, maxVal, step, base, 'var(--green)', changed);
    });
    sh += '</div>';
  }

  // ── GASTOS ──
  if(DATA.gastos.length > 0){
    sh += '<div style="margin-bottom:1.2rem;">';
    sh += '<h4 style="color:var(--red);font-size:0.85rem;margin-bottom:0.6rem;">📉 GASTOS</h4>';
    // Agrupar por categoría
    var cats = {};
    DATA.gastos.forEach(function(g){ cats[g.categoria] = (cats[g.categoria]||[]).concat(g); });
    Object.keys(cats).sort().forEach(function(cat){
      sh += '<div style="font-size:0.72rem;color:var(--txt3);text-transform:uppercase;margin:0.6rem 0 0.3rem;letter-spacing:0.5px;font-weight:600;">'+cat+'</div>';
      cats[cat].forEach(function(g){
        var key = 'gas_' + g.id;
        var base = g.monto;
        var cur = simGet(key, base);
        var maxVal = Math.max(base * 3, 500);
        var step = Math.max(Math.round(base * 0.01), 5);
        var changed = Math.abs(cur - base) > 0.5;
        sh += simSlider(key, g.nombre, g.tipo, cur, 0, maxVal, step, base, 'var(--red)', changed);
      });
    });
    sh += '</div>';
  }

  // ── CUOTAS DEUDA ──
  if(DATA.deudas.length > 0){
    sh += '<div style="margin-bottom:1.2rem;">';
    sh += '<h4 style="color:var(--orange);font-size:0.85rem;margin-bottom:0.6rem;">💳 CUOTAS DE DEUDA</h4>';
    DATA.deudas.forEach(function(d){
      var key = 'deu_' + d.id;
      var base = d.pago;
      var cur = simGet(key, base);
      var maxVal = Math.max(base * 3, 500);
      var step = Math.max(Math.round(base * 0.01), 5);
      var changed = Math.abs(cur - base) > 0.5;
      sh += simSlider(key, d.nombre, d.tasa+'% EA', cur, 0, maxVal, step, base, 'var(--orange)', changed);
    });
    sh += '</div>';
  }

  document.getElementById('sim-params').innerHTML = sh;
}

function simSlider(key, label, sublabel, current, min, max, step, base, color, changed){
  var h = '<div style="margin-bottom:0.6rem;padding:0.5rem 0.6rem;background:'+(changed?'rgba(247,181,0,0.04)':'transparent')+';border-radius:6px;border:1px solid '+(changed?'rgba(247,181,0,0.15)':'transparent')+';transition:all 0.2s;">';
  h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.2rem;">';
  h += '<div><span style="font-size:0.82rem;font-weight:600;color:var(--txt);">'+label+'</span>';
  if(sublabel) h += ' <span style="font-size:0.68rem;color:var(--txt3);">'+sublabel+'</span>';
  h += '</div>';
  h += '<span style="font-weight:700;color:'+color+';font-size:0.9rem;" id="simv_'+key+'">'+fUSD(current)+'</span></div>';
  h += '<input type="range" style="accent-color:'+color+';" min="'+min+'" max="'+max+'" step="'+step+'" value="'+current+'" oninput="onSimSlider(\''+key+'\',+this.value)">';
  h += '<div style="display:flex;justify-content:space-between;font-size:0.65rem;color:var(--txt3);"><span>'+fUSD(min)+'</span>';
  if(changed) h += '<span style="color:var(--accent);cursor:pointer;" onclick="simVals[\''+key+'\']=undefined;renderSimulador();">↺ Reset ('+fUSD(base)+')</span>';
  else h += '<span>Base: '+fUSD(base)+'</span>';
  h += '<span>'+fUSD(max)+'</span></div></div>';
  return h;
}

function simMetric(label, val, sub, color){
  return '<div style="background:var(--bg3);border-radius:8px;padding:0.7rem 0.8rem;border-top:3px solid '+color+';"><div style="font-size:0.65rem;color:var(--txt3);text-transform:uppercase;letter-spacing:0.5px;">'+label+'</div><div style="font-weight:700;font-size:1.15rem;color:'+color+';margin-top:0.15rem;">'+val+'</div>'+(sub?'<div style="font-size:0.7rem;color:var(--txt3);margin-top:0.1rem;">'+sub+'</div>':'')+'</div>';
}

function onSimSlider(key, val){
  simVals[key] = val;
  // Update display label instantly
  var el = document.getElementById('simv_' + key);
  if(el) el.textContent = fUSD(val);
  // Debounce full re-render
  clearTimeout(window._simTimer);
  window._simTimer = setTimeout(function(){ renderSimulador(); }, 250);
}

  var totalActivos = DATA.inversiones.reduce(function(s,i){return s+i.valorActual;},0);
  var netWorth = totalActivos - totalDeuda;
  var cashFlow = totalIng - totalGas - totalCuotas;
  var independencia = (totalGas+totalCuotas) > 0 ? (totalIng/(totalGas+totalCuotas))*100 : 0;
  var ahorro = totalIng > 0 ? (cashFlow/totalIng)*100 : 0;
  var deudaRatio = totalIng > 0 ? (totalCuotas/totalIng)*100 : 0;
  var dta = totalActivos > 0 ? (totalDeuda/totalActivos)*100 : 0;
  // Top deuda más cara
  var maxDeuda = DATA.deudas.reduce(function(max,d){return d.tasa>max.tasa?d:max;},{tasa:0,nombre:'N/A',monto:0});
  // Tipos de inversión
  var tipos = {};
  DATA.inversiones.forEach(function(i){tipos[i.tipo]=(tipos[i.tipo]||0)+i.valorActual;});

  return {totalIng:totalIng, totalGas:totalGas, totalCuotas:totalCuotas, totalDeuda:totalDeuda,
    totalActivos:totalActivos, netWorth:netWorth, cashFlow:cashFlow, independencia:independencia,
    ahorro:ahorro, deudaRatio:deudaRatio, dta:dta, maxDeuda:maxDeuda, tipos:tipos,
    cashFlowAnual:cashFlow*12, freedomFund:(totalGas+totalCuotas)*6};
}

function sectionUpload(file, tipo){
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try {
      var data = new Uint8Array(e.target.result);
      var wb = XLSX.read(data, {type:'array'});
      var sheet = wb.Sheets[wb.SheetNames[0]];
      var raw = XLSX.utils.sheet_to_json(sheet, {defval:'', header:1});
      var items = smartParse(raw);
      if(items.length === 0){ alert('No se encontraron datos en el archivo.'); return; }
      var inCOP = isCOP(items);
      var d = inCOP ? TRM : 1;
      var count = 0;
      items.forEach(function(it){
        if(tipo === 'inversion'){
          DATA.inversiones.push({id:uid(), nombre:it.nombre, tipo:it.categoria||'Otro', ubicacion:'', valorCompra:(it.valor||0)/d, valorActual:(it.valor||0)/d, deuda:0, notas:''});
          if(it.ingreso > 0) DATA.ingresos.push({id:uid(), nombre:'Renta '+it.nombre, monto:it.ingreso/d, tipo:'Variable', notas:''});
          if(it.gastoMes > 0) DATA.gastos.push({id:uid(), nombre:'Gastos '+it.nombre, categoria:'Operativo', monto:it.gastoMes/d, tipo:'Fijo', notas:''});
        } else if(tipo === 'ingreso'){
          DATA.ingresos.push({id:uid(), nombre:it.nombre, monto:(it.mensual||it.ingreso||it.valor)/d, tipo:'Fijo', notas:it.categoria});
        } else if(tipo === 'gasto'){
          DATA.gastos.push({id:uid(), nombre:it.nombre, categoria:it.categoria||'General', monto:(it.mensual||it.gastoMes||it.valor)/d, tipo:'Fijo', notas:''});
        } else if(tipo === 'deuda'){
          DATA.deudas.push({id:uid(), nombre:it.nombre, monto:(it.valor||0)/d, pago:(it.mensual||0)/d, tasa:it.tasa||0, notas:''});
        }
        count++;
      });
      save();
      alert('Importados: ' + count + ' ' + tipo + 's' + (inCOP ? ' (COP→USD TRM $'+TRM.toLocaleString()+')' : ''));
      renderActive();
    } catch(err){ alert('Error: '+err.message); }
  };
  reader.readAsArrayBuffer(file);
}

function smartParse(rows){
  if(!rows || rows.length < 2) return [];
  
  // ── Step 1: Scan ALL rows to find where data lives ──
  var maxScan = Math.min(rows.length, 200);
  var colStats = {}; // col → {textCount, numCount, samples}
  var firstDataRow = -1;
  
  for(var r = 0; r < maxScan; r++){
    var row = rows[r] || [];
    for(var c = 0; c < row.length; c++){
      var v = (row[c]===null||row[c]===undefined) ? '' : row[c].toString().trim();
      if(!v) continue;
      if(!colStats[c]) colStats[c] = {textCount:0, numCount:0, textSamples:[], numSamples:[]};
      if(!isNaN(v) && v !== '' && parseFloat(v) !== 0){
        colStats[c].numCount++;
        colStats[c].numSamples.push(parseFloat(v));
      } else if(v.length > 0 && isNaN(v)){
        colStats[c].textCount++;
        if(colStats[c].textSamples.length < 5) colStats[c].textSamples.push(v);
      }
    }
  }
  
  // ── Step 2: Identify NAME column (most text values) and VALUE columns (most numeric values) ──
  var nameCol = -1, maxText = 0;
  var numCols = [];
  Object.keys(colStats).forEach(function(c){
    var s = colStats[c];
    if(s.textCount > maxText){ maxText = s.textCount; nameCol = parseInt(c); }
    if(s.numCount >= 2) numCols.push({col:parseInt(c), count:s.numCount, avg:s.numSamples.reduce(function(a,b){return a+b;},0)/s.numSamples.length});
  });
  numCols.sort(function(a,b){ return a.col - b.col; });
  
  if(nameCol < 0) return []; // No text data found
  
  // ── Step 3: Try to find a header row (row with text in the name column AND known keywords in other columns) ──
  var headerIdx = -1, colMap = {};
  for(var r = 0; r < maxScan; r++){
    var row = rows[r] || [];
    var nameVal = (row[nameCol]||'').toString().trim();
    if(!nameVal || nameVal.length < 2) continue;
    var nLow = nameVal.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    
    // Check if this row looks like a header (multiple text cells, keywords present)
    var keywords = 0, textInRow = 0;
    for(var c = 0; c < row.length; c++){
      var v = (row[c]||'').toString().trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
      if(v && isNaN(v) && v.length > 1) textInRow++;
      if(v.indexOf('valor')>=0||v.indexOf('ingreso')>=0||v.indexOf('gasto')>=0||v.indexOf('mensual')>=0||v.indexOf('anual')>=0||v.indexOf('neto')>=0||v.indexOf('cuota')>=0||v.indexOf('pago')>=0||v.indexOf('tasa')>=0||v==='x mes') keywords++;
    }
    
    if(keywords >= 1 && textInRow >= 2){
      headerIdx = r;
      for(var c = 0; c < row.length; c++){
        var v = (row[c]||'').toString().trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
        if(!v || v.length < 2) continue;
        if(c === nameCol){ colMap[c] = 'nombre'; continue; }
        if(v.indexOf('activo')>=0||v.indexOf('nombre')>=0||v.indexOf('descripcion')>=0||v.indexOf('concepto')>=0) colMap[c] = 'nombre';
        else if(v==='valor'||v.indexOf('valor total')>=0||v.indexOf('saldo')>=0||v.indexOf('balance')>=0||v.indexOf('total')>=0) colMap[c] = 'valor';
        else if(v.indexOf('ingreso')>=0||v.indexOf('renta')>=0) colMap[c] = 'ingreso';
        else if(v.indexOf('gasto')>=0) colMap[c] = 'gastoMes';
        else if(v.indexOf('neto')>=0) colMap[c] = 'neto';
        else if(v.indexOf('mensual')>=0||v==='x mes'||v.indexOf('cuota')>=0||v.indexOf('pago')>=0||v.indexOf('monto')>=0) colMap[c] = 'mensual';
        else if(v.indexOf('anual')>=0) colMap[c] = 'anual';
        else if(v.indexOf('tasa')>=0||v.indexOf('interes')>=0||v.indexOf('rate')>=0) colMap[c] = 'tasa';
      }
      break;
    }
    
    // Check if this row has NUMBERS alongside text → it's data, stop looking for headers
    var hasNums = false;
    for(var c = 0; c < row.length; c++){
      var v = row[c];
      if(typeof v === 'number' && v !== 0) hasNums = true;
    }
    if(hasNums && nameVal.toUpperCase() !== 'TOTAL'){
      firstDataRow = r;
      break;
    }
  }
  
  // ── Step 4: No header found → auto-map columns from structure ──
  if(headerIdx < 0){
    colMap[nameCol] = 'nombre';
    if(numCols.length === 1){
      colMap[numCols[0].col] = 'mensual';
    } else if(numCols.length === 2){
      colMap[numCols[0].col] = 'mensual';
      colMap[numCols[1].col] = 'anual';
    } else if(numCols.length === 3){
      colMap[numCols[0].col] = 'valor';
      colMap[numCols[1].col] = 'mensual';
      colMap[numCols[2].col] = 'anual';
    } else if(numCols.length >= 4){
      colMap[numCols[0].col] = 'valor';
      colMap[numCols[1].col] = 'ingreso';
      colMap[numCols[2].col] = 'gastoMes';
      colMap[numCols[3].col] = 'neto';
    }
  }
  
  // ── Step 5: Parse data rows ──
  var startRow = headerIdx >= 0 ? headerIdx + 1 : (firstDataRow >= 0 ? Math.max(0, firstDataRow - 5) : 0);
  var items = [], currentCat = '';
  var skipWords = ['TOTAL','GRAN TOTAL','STATUS','GASTOS'];
  
  for(var r = startRow; r < rows.length; r++){
    var row = rows[r] || [];
    var nombre = (row[nameCol]===null||row[nameCol]===undefined) ? '' : row[nameCol].toString().trim();
    if(!nombre) continue;
    var nu = nombre.toUpperCase().trim();
    if(skipWords.indexOf(nu) >= 0 || nu.indexOf('TOTAL') === 0) continue;
    if(nombre.length > 80) continue; // Skip freetext notes
    
    // Does this row have numbers?
    var hasNum = false, numVals = {};
    Object.keys(colMap).forEach(function(c){
      if(colMap[c] === 'nombre') return;
      var v = parseFloat(row[parseInt(c)]);
      if(!isNaN(v) && v !== 0){ hasNum = true; numVals[colMap[c]] = v; }
    });
    
    if(!hasNum){ currentCat = nombre; continue; } // Category header
    
    var item = {nombre:nombre, categoria:currentCat, valor:0, mensual:0, ingreso:0, gastoMes:0, neto:0, tasa:0, anual:0};
    Object.keys(numVals).forEach(function(k){ item[k] = numVals[k]; });
    if(item.mensual === 0 && item.anual > 0) item.mensual = item.anual / 12;
    items.push(item);
  }
  return items;
}

function isCOP(items){
  for(var i = 0; i < items.length; i++){
    if(items[i].valor > 50000 || items[i].mensual > 50000 || items[i].ingreso > 50000) return true;
  }
  return false;
}

function showParsedPreview(items, filename){
  if(!items || items.length === 0){
    document.getElementById('import-preview').innerHTML = '<div style="padding:1rem;color:var(--red);">No se encontraron datos.</div>';
    return;
  }
  var inCOP = isCOP(items);
  importPreview = {items: items, inCOP: inCOP};
  
  var hasIngreso = items.some(function(i){return i.ingreso > 0;});
  var hasGastoMes = items.some(function(i){return i.gastoMes > 0;});
  var hasValor = items.some(function(i){return i.valor > 0;});
  var hasTasa = items.some(function(i){return i.tasa > 0;});
  
  var likelyType = 'gasto';
  if(hasIngreso || (hasValor && hasGastoMes)) likelyType = 'activos';
  if(hasTasa) likelyType = 'deuda';
  
  var h = '<div style="margin-top:1.2rem;">';
  h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.8rem;flex-wrap:wrap;gap:0.5rem;">';
  h += '<div><span style="font-weight:700;color:var(--accent);">'+filename+'</span>';
  h += ' <span style="font-size:0.75rem;color:var(--txt3);">'+items.length+' items'+(inCOP?' • COP':'')+'</span></div>';
  h += '<div style="display:flex;gap:0.5rem;align-items:center;">';
  h += '<span style="font-size:0.72rem;color:var(--txt3);">Importar como:</span>';
  h += '<select id="import-type" class="form-select" style="padding:0.25rem 0.5rem;font-size:0.75rem;">';
  h += '<option value="activos"'+(likelyType==='activos'?' selected':'')+'>Activos</option>';
  h += '<option value="ingreso">Ingresos</option>';
  h += '<option value="gasto"'+(likelyType==='gasto'?' selected':'')+'>Gastos</option>';
  h += '<option value="deuda"'+(likelyType==='deuda'?' selected':'')+'>Deudas</option></select>';
  h += '<button class="btn btn-accent" onclick="confirmSmartImport()">Importar '+items.length+'</button></div></div>';
  
  if(inCOP) h += '<div style="padding:0.4rem 0.6rem;background:rgba(0,200,255,0.06);border-radius:6px;margin-bottom:0.6rem;font-size:0.72rem;color:var(--blue);border:1px solid rgba(0,200,255,0.15);">Valores en COP. Se convierten a USD con TRM $'+TRM.toLocaleString()+'</div>';
  
  h += '<div style="max-height:350px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;"><table><thead><tr><th>Nombre</th><th>Categoría</th>';
  if(hasValor) h += '<th>Valor</th>';
  if(hasIngreso) h += '<th>Ingreso/mes</th>';
  if(hasGastoMes) h += '<th>Gasto/mes</th>';
  h += '<th>Mensual</th>';
  if(hasTasa) h += '<th>Tasa</th>';
  h += '</tr></thead><tbody>';
  items.forEach(function(it){
    var fv = function(v){ return v > 0 ? (inCOP ? '$'+(v/1e6).toFixed(1)+'M' : fUSD(v)) : '—'; };
    h += '<tr><td style="font-weight:600;">'+it.nombre+'</td><td style="font-size:0.7rem;color:var(--txt3);">'+it.categoria+'</td>';
    if(hasValor) h += '<td>'+fv(it.valor)+'</td>';
    if(hasIngreso) h += '<td style="color:var(--green);">'+fv(it.ingreso)+'</td>';
    if(hasGastoMes) h += '<td style="color:var(--red);">'+fv(it.gastoMes)+'</td>';
    h += '<td style="font-weight:600;">'+fv(it.mensual)+'</td>';
    if(hasTasa) h += '<td>'+(it.tasa > 0 ? it.tasa+'%' : '—')+'</td>';
    h += '</tr>';
  });
  h += '</tbody></table></div></div>';
  document.getElementById('import-preview').innerHTML = h;
}

function confirmSmartImport(){
  if(!importPreview) return;
  var items = importPreview.items, inCOP = importPreview.inCOP;
  var d = inCOP ? TRM : 1;
  var tipo = document.getElementById('import-type').value;
  var c = 0;
  items.forEach(function(it){
    if(tipo === 'activos'){
      DATA.inversiones.push({id:uid(), nombre:it.nombre, tipo:it.categoria||'Otro', ubicacion:'', valorCompra:(it.valor||0)/d, valorActual:(it.valor||0)/d, deuda:0, notas:''});
      if(it.ingreso > 0) DATA.ingresos.push({id:uid(), nombre:'Renta '+it.nombre, monto:it.ingreso/d, tipo:'Variable', notas:''});
      if(it.gastoMes > 0) DATA.gastos.push({id:uid(), nombre:'Gastos '+it.nombre, categoria:'Operativo', monto:it.gastoMes/d, tipo:'Fijo', notas:''});
    } else if(tipo === 'ingreso'){
      DATA.ingresos.push({id:uid(), nombre:it.nombre, monto:(it.mensual||it.ingreso||it.valor)/d, tipo:'Fijo', notas:it.categoria});
    } else if(tipo === 'gasto'){
      DATA.gastos.push({id:uid(), nombre:it.nombre, categoria:it.categoria||'General', monto:(it.mensual||it.gastoMes||it.valor)/d, tipo:'Fijo', notas:''});
    } else if(tipo === 'deuda'){
      DATA.deudas.push({id:uid(), nombre:it.nombre, monto:(it.valor||0)/d, pago:(it.mensual||0)/d, tasa:it.tasa||0, notas:''});
    }
    c++;
  });
  save(); importPreview = null;
  document.getElementById('import-preview').innerHTML = '<div style="padding:1rem;background:rgba(0,229,160,0.08);border-radius:10px;margin-top:1rem;border:1px solid rgba(0,229,160,0.2);"><div style="font-weight:700;color:var(--green);">'+c+' items importados como '+tipo+'</div>'+(inCOP?'<div style="font-size:0.75rem;color:var(--txt3);">COP → USD con TRM $'+TRM.toLocaleString()+'</div>':'')+'<button class="btn btn-accent" style="margin-top:0.6rem;" onclick="go(\'dashboard\')">Dashboard →</button></div>';
}

function exportData(){

    rows.push({tipo:'inversion', nombre:i.nombre, categoria:i.tipo, valor:i.valorActual, mensual:0, tasa:0, valor_compra:i.valorCompra});
  });
  DATA.ingresos.forEach(function(i){
    rows.push({tipo:'ingreso', nombre:i.nombre, categoria:'', valor:0, mensual:i.monto, tasa:0, valor_compra:0});
  });
  DATA.gastos.forEach(function(g){
    rows.push({tipo:'gasto', nombre:g.nombre, categoria:g.categoria, valor:0, mensual:g.monto, tasa:0, valor_compra:0});
  });
  DATA.deudas.forEach(function(d){
    rows.push({tipo:'deuda', nombre:d.nombre, categoria:'', valor:d.monto, mensual:d.pago, tasa:d.tasa, valor_compra:0});
  });

  if(rows.length === 0){ alert('No hay datos para exportar.'); return; }

  var wb = XLSX.utils.book_new();
  var ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:12},{wch:25},{wch:15},{wch:12},{wch:12},{wch:8},{wch:14}];
  XLSX.utils.book_append_sheet(wb, ws, 'MisDatos');

}

  + '<div><div style="font-weight:700;color:'+color+';">'+label+'</div><div style="font-size:0.78rem;color:var(--txt3);">'+count+' items</div></div>'

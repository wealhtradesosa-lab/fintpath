<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FINPATH — Tu camino a la libertad financiera</title>
    <meta name="description" content="Plataforma fintech premium para controlar inversiones, gastos, deudas y patrimonio. 5 coaches IA. Pensión BTC." />
    <meta name="theme-color" content="#09090b" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%2309090b'/%3E%3Ctext x='50' y='62' text-anchor='middle' font-size='40' font-weight='800' fill='%2322c55e'%3EF%3C/text%3E%3C/svg%3E" />
  <style>
      @media print {
        @page { size: letter portrait; margin: 8mm 8mm; }
        * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; box-sizing: border-box !important; }
        body { background: #fff !important; color: #222 !important; margin: 0 !important; font-size: 9px !important; line-height: 1.3 !important; font-family: -apple-system, system-ui, sans-serif !important; }
        
        /* HIDE everything non-essential */
        aside, header, nav, footer, button, input[type="range"], [data-no-print], 
        div[style*="click para info"], div[style*="Mueve para simular"], div[style*="Capital invertido:"],
        div[style*="fadeIn"], div[style*="cursor: pointer"] { display: none !important; }
        
        /* Full width */
        #root, #root > div, main, #root > div > div, #root > div > main { 
          display: block !important; width: 100% !important; max-width: 100% !important; 
          padding: 0 !important; margin: 0 !important; flex: none !important; 
        }
        [style*="overflow"] { overflow: visible !important; max-height: none !important; height: auto !important; }
        [style*="70vh"], [style*="85vh"], [style*="88vh"] { max-height: none !important; height: auto !important; }
        
        /* ULTRA COMPACT cards */
        div[style*="border-radius"] { 
          background: #fff !important; border: 1px solid #ddd !important; 
          box-shadow: none !important; margin-bottom: 3px !important; 
          padding: 4px 8px !important; border-radius: 4px !important;
        }
        
        /* Compact text sizes */
        h1 { font-size: 14px !important; margin: 0 0 2px !important; color: #111 !important; }
        h2 { font-size: 12px !important; margin: 0 0 2px !important; color: #111 !important; }
        h3 { font-size: 11px !important; margin: 2px 0 !important; color: #111 !important; }
        h4 { font-size: 10px !important; margin: 2px 0 !important; color: #111 !important; }
        p { margin: 1px 0 !important; font-size: 9px !important; }
        
        /* All text dark */
        p, span, div, td, th, label { color: #333 !important; }
        
        /* Preserve key colors */
        [style*="color:#22c55e"], [style*="color: rgb(34, 197, 94)"] { color: #16a34a !important; }
        [style*="color:#ef4444"], [style*="color: rgb(239, 68, 68)"] { color: #dc2626 !important; }
        [style*="color:#3b82f6"] { color: #2563eb !important; }
        [style*="color:#22d3ee"] { color: #0891b2 !important; }
        [style*="color:#f97316"] { color: #ea580c !important; }
        [style*="color:#eab308"] { color: #ca8a04 !important; }
        
        /* Big numbers: shrink */
        div[style*="clamp("], div[style*="fontSize: 36"], div[style*="fontSize:36"],
        div[style*="fontSize: 32"], div[style*="fontSize:32"] { font-size: 16px !important; }
        div[style*="fontSize: 28"], div[style*="fontSize:28"] { font-size: 14px !important; }
        div[style*="fontSize: 64"], div[style*="fontSize:64"],
        div[style*="fontSize: 72"], div[style*="fontSize:72"] { font-size: 20px !important; }
        div[style*="fontSize: 22"], div[style*="fontSize:22"] { font-size: 12px !important; }
        div[style*="fontSize: 18"], div[style*="fontSize:18"] { font-size: 11px !important; }
        div[style*="fontSize: 16"], div[style*="fontSize:16"] { font-size: 10px !important; }
        div[style*="fontSize: 15"], div[style*="fontSize:15"] { font-size: 10px !important; }
        
        /* Grids: keep 2-col for KPIs, force compact */
        div[style*="gridTemplateColumns"] { display: block !important; }
        div[style*="repeat(auto-fit"] { display: grid !important; grid-template-columns: 1fr 1fr 1fr 1fr !important; gap: 3px !important; }
        div[style*="repeat(4"] { display: grid !important; grid-template-columns: 1fr 1fr 1fr 1fr !important; gap: 3px !important; }
        div[style*="repeat(5"] { display: grid !important; grid-template-columns: repeat(5,1fr) !important; gap: 2px !important; }
        
        /* 2-col comparison cards stay side by side */
        div[style*="1fr 1fr"][style*="gap: 16"] { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 4px !important; }
        
        div[style*="grid"] > * { page-break-inside: avoid !important; break-inside: avoid !important; }
        
        /* Freedom bar: very compact */
        div[style*="borderRadius: 20"] { padding: 6px 8px !important; margin-bottom: 4px !important; }
        div[style*="height: 36"] { height: 12px !important; }
        
        /* Income cards: tiny */
        div[style*="#22d3ee06"], div[style*="#22d3ee08"] { 
          padding: 3px 6px !important; margin-bottom: 2px !important; 
          border-radius: 3px !important; border-width: 1px !important;
        }
        div[style*="borderLeft: "3px"] { border-left-width: 2px !important; padding: 2px 6px !important; }
        
        /* Gastos sliders: just show name + value, super compact */
        div[style*="accentColor"] { display: none !important; }
        
        /* Charts: small */
        .recharts-wrapper { max-height: 100px !important; page-break-inside: avoid !important; }
        .recharts-responsive-container { height: 100px !important; max-height: 100px !important; }
        svg { max-width: 100% !important; max-height: 100px !important; }
        svg text { fill: #555 !important; font-size: 7px !important; }
        
        /* Tables ultra compact */
        table { font-size: 8px !important; width: 100% !important; border-collapse: collapse !important; }
        th { background: #f5f5f5 !important; padding: 2px 4px !important; font-size: 7px !important; }
        td { padding: 2px 4px !important; }
        
        /* Padding/margin reductions */
        div[style*="padding: 28"], div[style*="padding:28"] { padding: 6px 8px !important; }
        div[style*="padding: 24"], div[style*="padding:24"] { padding: 5px 8px !important; }
        div[style*="padding: 20"], div[style*="padding:20"] { padding: 4px 6px !important; }
        div[style*="padding: 16"], div[style*="padding:16"] { padding: 3px 6px !important; }
        div[style*="marginBottom: 20"], div[style*="marginBottom:20"] { margin-bottom: 4px !important; }
        div[style*="marginBottom: 16"], div[style*="marginBottom:16"] { margin-bottom: 3px !important; }
        div[style*="marginBottom: 12"], div[style*="marginBottom:12"] { margin-bottom: 2px !important; }
        div[style*="gap: 16"], div[style*="gap:16"] { gap: 3px !important; }
        div[style*="gap: 14"], div[style*="gap:14"] { gap: 3px !important; }
        div[style*="gap: 12"], div[style*="gap:12"] { gap: 2px !important; }
        div[style*="gap: 10"], div[style*="gap:10"] { gap: 2px !important; }
        
        /* HERO disponible: compact */
        div[style*="clamp(1.8rem"] { font-size: 18px !important; line-height: 1.1 !important; }
        
        /* Hide helper text */
        div[style*="opacity: 0.7"] { display: none !important; }
        
        /* Report branding */
        body::before { content: "FINPATH — Reporte Financiero"; display: block; font-size: 12px; font-weight: 800; color: #16a34a; padding: 0 0 4px; border-bottom: 2px solid #16a34a; margin-bottom: 6px; }
        body::after { content: "Generado: " attr(data-date) " | fintpath.vercel.app"; display: block; font-size: 7px; color: #999; padding: 4px 0 0; border-top: 1px solid #ddd; margin-top: 4px; text-align: center; }
      }
    </style>
    </head>
  <body style="margin:0;background:#09090b;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

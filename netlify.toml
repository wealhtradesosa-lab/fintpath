[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# API routes -> Netlify Functions (MUST be before SPA catch-all)
[[redirects]]
  from = "/api/trm"
  to = "/.netlify/functions/trm"
  status = 200

[[redirects]]
  from = "/api/analyze-excel"
  to = "/.netlify/functions/analyze-excel"
  status = 200

[[redirects]]
  from = "/api/stock-price"
  to = "/.netlify/functions/stock-prices"
  status = 200

[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

[[redirects]]
  from = "/api/stripe-checkout"
  to = "/.netlify/functions/stripe-checkout"
  status = 200

[[redirects]]
  from = "/api/auth-signup"
  to = "/.netlify/functions/auth-signup"
  status = 200

[[redirects]]
  from = "/api/stock-prices"
  to = "/.netlify/functions/stock-prices"
  status = 200

# SPA fallback (LAST - catches everything else)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

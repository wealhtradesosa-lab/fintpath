[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# API routes -> Netlify Functions (MUST be before SPA catch-all)
[[redirects]]
  from = "/api/trm"
  to = "/.netlify/functions/trm"
  status = 200

[[redirects]]
  from = "/api/analyze-excel"
  to = "/.netlify/functions/analyze-excel"
  status = 200

[[redirects]]
  from = "/api/parse-declaration"
  to = "/.netlify/functions/parse-declaration"
  status = 200

[[redirects]]
  from = "/api/stock-price"
  to = "/.netlify/functions/stock-prices"
  status = 200

[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

[[redirects]]
  from = "/api/stripe-checkout"
  to = "/.netlify/functions/stripe-checkout"
  status = 200

[[redirects]]
  from = "/api/auth-signup"
  to = "/.netlify/functions/auth-signup"
  status = 200

[[redirects]]
  from = "/api/ai-chat"
  to = "/.netlify/functions/ai-chat"
  status = 200

[[redirects]]
  from = "/api/agente-tributario-ia"
  to = "/.netlify/functions/agente-tributario-ia"
  status = 200

[[redirects]]
  from = "/api/stock-prices"
  to = "/.netlify/functions/stock-prices"
  status = 200

[[redirects]]
  from = "/api/advisor-lead"
  to = "/.netlify/functions/advisor-lead"
  status = 200

[[redirects]]
  from = "/api/advisor-invite"
  to = "/.netlify/functions/advisor-invite"
  status = 200

[[redirects]]
  from = "/api/advisor-accept-invite"
  to = "/.netlify/functions/advisor-accept-invite"
  status = 200

# SPA fallback (LAST - catches everything else)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SEO
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"

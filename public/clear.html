<!DOCTYPE html>
<html>
<head><title>FINPATH - Clearing cache...</title></head>
<body style="background:#09090b;color:#fafafa;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui">
<div style="text-align:center">
<h2>Limpiando cache...</h2>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(sw=>sw.unregister()));}
if('caches' in window){caches.keys().then(k=>k.forEach(n=>caches.delete(n)));}
try{localStorage.clear()}catch(e){}
setTimeout(()=>{window.location.href='/?v='+Date.now();},1500);
</script>
<p>Redirigiendo en 2 segundos...</p>
</div>
</body>
</html>
